<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TREE COMPANY - Աշխատանք</title>
    <meta name="theme-color" content="#EBF1EC" id="themeColorMeta">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TREE COMPANY">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
    <link rel="manifest" href="manifest.json">
    <script>
        (function() {
            try {
                var savedTheme = localStorage.getItem('app_theme');
                var systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                } else {
                    document.documentElement.setAttribute('data-theme', 'light');
                }
            } catch (e) {}
        })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&family=Noto+Sans+Armenian:wght@500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=16.0">
</head>
<body>
    <div class="noise-overlay"></div><div class="ambient-glow"></div>
    <div class="app-container">
        <header class="app-header">
            <div class="header-left">
                <button class="back-btn" onclick="window.history.back()" aria-label="Հետ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
                <button class="theme-btn" id="theme-btn"><span class="theme-icon" id="theme-icon"></span></button>
            </div>
            <div class="header-logo-container"><img src="assets/tree.png" class="main-logo"></div>
            <div class="header-right">
                <div class="lang-switcher" id="lang-switcher">
                    <button class="lang-btn-main" id="current-lang-btn" type="button"><img src="assets/free-icon-armenia-197516.png" class="lang-flag"></button>
                    <div class="lang-dropdown-content">
                        <button type="button" class="lang-tab active" data-lang="AM"><img src="assets/free-icon-armenia-197516.png" class="lang-flag"></button>
                        <button type="button" class="lang-tab" data-lang="RU"><img src="assets/free-icon-russia-9994030.png" class="lang-flag"></button>
                        <button type="button" class="lang-tab" data-lang="EN"><img src="assets/united-kingdom.png" class="lang-flag"></button>
                    </div>
                </div>
            </div>
        </header>

        <h1 class="page-title" data-i18n="btn_become_employee" style="margin-bottom: 12px;">Դառնալ աշխատակից</h1>
        <p style="text-align: center; color: var(--text-sec); font-size: 11px; font-weight: 800; margin-bottom: 24px; padding: 0 20px; text-transform: uppercase;" data-i18n="desc_employee">Լրացրեք հայտը մեր թիմին միանալու համար</p>

        <form id="apply-form" class="form-card" action="#">
            <div class="input-group">
                <label class="input-label" for="name" data-i18n="lbl_name">Անուն Ազգանուն *</label>
                <input type="text" id="name" class="glass-input" data-i18n-placeholder="pl_name" required>
            </div>
            
            <div class="input-row">
                <div class="input-group" style="flex: 1;">
                    <label class="input-label" for="birth_year" data-i18n="lbl_year">Ծննդյան տարեթիվ *</label>
                    <input type="number" id="birth_year" class="glass-input" data-i18n-placeholder="pl_year" min="1940" max="2010" required>
                </div>
                <div class="input-group" style="flex: 1.5;">
                    <label class="input-label" for="phone" data-i18n="lbl_phone">Հեռախոսահամար *</label>
                    <input type="tel" id="phone" class="glass-input" value="+374 " inputmode="tel" required>
                </div>
            </div>
            
            <div class="input-group">
                <label class="input-label" for="profession" data-i18n="lbl_prof">Ի՞նչ մասնագետ եք *</label>
                <select id="profession" class="glass-input" required>
                    <option value="" disabled selected data-i18n="opt_1">Ընտրեք տարբերակը...</option>
                    <option value="door_master" data-i18n="door_master">Դռան վարպետ</option>
                    <option value="baseboard_master" data-i18n="baseboard_master">Պլինտուսի վարպետ</option>
                    <option value="universal_master" data-i18n="universal_master">Ունիվերսալ վարպետ</option>
                    <option value="assistant" data-i18n="assistant">Վարպետի օգնական</option>
                    <option value="other" data-i18n="opt_prof_other">Այլ (նշել)</option>
                </select>
                <input type="text" id="custom_profession" class="glass-input" data-i18n-placeholder="pl_custom_prof" style="display: none; margin-top: 8px;">
            </div>

            <div class="input-group">
                <label class="input-label" for="price" data-i18n="lbl_price">Ծառայությունների արժեքը *</label>
                <input type="text" id="price" class="glass-input" data-i18n-placeholder="pl_price" required>
            </div>
            
            <div class="input-group">
                <label class="input-label" for="schedule" data-i18n="lbl_schedule">Աշխատանքային գրաֆիկ *</label>
                <input type="text" id="schedule" class="glass-input" data-i18n-placeholder="pl_schedule" required>
            </div>
            
            <div class="input-group">
                <label class="input-label" for="message" data-i18n="lbl_msg">Այլ լրացուցիչ տեղեկություններ</label>
                <textarea id="message" class="glass-input" data-i18n-placeholder="pl_msg"></textarea>
            </div>
            
            <button type="submit" class="submit-btn" data-i18n="submit">Ուղարկել</button>
        </form>
    </div>

    <!-- ТОЛЬКО 3 КНОПКИ ВНИЗУ -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item" id="nav-home">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            <span data-i18n="nav_home">Գլխավոր</span>
        </a>
        <a href="orders.html" class="nav-item" id="nav-orders">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            <span data-i18n="nav_orders">Պատվերներ</span>
        </a>
        <a href="#" class="nav-item" id="nav-cabinet">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span data-i18n="nav_cabinet">Անձն. էջ</span>
        </a>
    </nav>
    <script src="main.js?v=18.1"></script>
</body>
</html>
