<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TREE COMPANY - Իմ էջը</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#EBF1EC" id="themeColorMeta">

    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
    <link rel="manifest" href="manifest.json">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&family=Noto+Sans+Armenian:wght@500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="noise-overlay"></div>
    <div class="ambient-glow"></div>

    <div class="app-container" id="account-page-marker">
        
        <header class="app-header">
            <div class="header-controls">
                <div class="lang-switcher" id="lang-switcher">
                    <button class="lang-btn-main" id="current-lang-btn" aria-label="Выбрать язык" type="button">
                        <img src="assets/free-icon-armenia-197516.png" alt="AM" class="lang-flag">
                    </button>
                    <div class="lang-dropdown-content">
                        <button type="button" class="lang-tab active" data-lang="AM" aria-label="Armenian">
                            <img src="assets/free-icon-armenia-197516.png" alt="AM" class="lang-flag">
                        </button>
                        <button type="button" class="lang-tab" data-lang="RU" aria-label="Russian">
                            <img src="assets/free-icon-russia-9994030.png" alt="RU" class="lang-flag">
                        </button>
                        <button type="button" class="lang-tab" data-lang="EN" aria-label="English">
                            <img src="assets/united-kingdom.png" alt="EN" class="lang-flag">
                        </button>
                    </div>
                </div>

                <button class="theme-btn" id="theme-btn" aria-label="Сменить тему">
                    <span class="theme-icon" id="theme-icon"></span>
                </button>
            </div>
            <div class="header-logo-container"><img src="assets/tree.svg" alt="Tree Logo" class="main-logo"></div>
            <div style="width: 48px;"></div> <!-- Пустой блок для симметрии -->
        </header>

        <h1 class="page-title" data-i18n="acc_title">Անձնական<br><span>Էջ</span></h1>

        <!-- БЛОК 1: НЕ АВТОРИЗОВАН (ВВОД ID) -->
        <div id="account-login-view" style="display: none; width: 100%;">
            <div class="form-card" style="text-align: center; padding: 40px 20px;">
                <div class="service-icon" style="color: var(--tree-light); font-size: 48px; margin-bottom: 16px;">
                    <svg viewBox="0 0 24 24" width="64" height="64" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                </div>
                <h3 class="screen-title" data-i18n="enter_id_title" style="margin-bottom: 10px;">Մուտքագրեք ID (Введите ID)</h3>
                <p style="font-size: 11px; color: var(--text-sec); font-weight: 600; margin-bottom: 24px;" data-i18n="acc_login_desc">Մուտքագրեք Ձեր ID-ն պատվերները տեսնելու համար</p>
                
                <input type="text" id="login-id-input" class="glass-input" data-i18n-placeholder="enter_id_pl" placeholder="TR-1234" style="text-align: center; font-weight: 900; font-size: 20px; letter-spacing: 2px;">
                
                <button type="button" class="submit-btn success" style="margin-top: 16px;" onclick="loginClient()">
                    <span data-i18n="btn_login">Մուտք (Войти)</span>
                </button>
            </div>
        </div>

        <!-- БЛОК 2: АВТОРИЗОВАН (ПРОФИЛЬ И ЗАКАЗЫ) -->
        <div id="account-profile-view" style="display: none; width: 100%;">
            
            <!-- Красивая карточка ID -->
            <div class="acc-id-card">
                <div class="acc-id-label" data-i18n="modal_success_id">Ձեր անձնական ID-ն՝ (Ваш личный ID)</div>
                <div class="acc-id-value" id="cabinet-id-display">TR-0000</div>
                
                <button class="logout-mini-btn" onclick="logoutClient()" aria-label="Выйти">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                </button>
            </div>

            <div class="grid-title" data-i18n="cab_title" style="margin-top: 24px;">Իմ պատվերները</div>
            
            <div id="cabinet-orders-list" style="display: flex; flex-direction: column; gap: 12px; width: 100%;">
                <!-- Сюда JS загрузит заказы -->
            </div>
        </div>

    </div>

    <!-- НИЖНЯЯ НАВИГАЦИЯ -->
    <nav class="bottom-nav">
        <a href="index.html" class="tab-item" id="tab-home">
            <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            <span data-i18n="nav_home">Գլխավոր</span>
        </a>
        <a href="jobs.html" class="tab-item" id="tab-jobs">
            <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
            <span data-i18n="nav_jobs">Աշխատանք</span>
        </a>
        <a href="account.html" class="tab-item active" id="tab-account">
            <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span data-i18n="nav_account">Իմ էջը</span>
        </a>
    </nav>

    <script src="main.js"></script>
</body>
</html>
