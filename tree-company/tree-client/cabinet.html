<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TREE COMPANY - Անձնական Էջ</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TREE COMPANY">
    <meta name="theme-color" content="#EBF1EC" id="themeColorMeta">

    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
    <link rel="manifest" href="manifest.json">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&family=Noto+Sans+Armenian:wght@500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="noise-overlay"></div>
    <div class="ambient-glow"></div>

    <div class="app-container">
        
        <header class="app-header">
            <div class="header-left">
                <button class="theme-btn" id="theme-btn" aria-label="Сменить тему">
                    <span class="theme-icon" id="theme-icon"></span>
                </button>
            </div>
            
            <div class="header-logo-container">
                <img src="assets/tree.svg" alt="Tree Logo" class="main-logo">
            </div>
            
            <div class="header-right">
                <div class="lang-switcher" id="lang-switcher">
                    <button class="lang-btn-main" id="current-lang-btn" aria-label="Выбрать язык" type="button">
                        <img src="assets/free-icon-armenia-197516.png" alt="AM" class="lang-flag">
                    </button>
                    <div class="lang-dropdown-content">
                        <button type="button" class="lang-tab active" data-lang="AM" aria-label="Armenian">
                            <img src="assets/free-icon-armenia-197516.png" alt="AM" class="lang-flag">
                        </button>
                        <button type="button" class="lang-tab" data-lang="RU" aria-label="Russian">
                            <img src="assets/free-icon-russia-9994030.png" alt="RU" class="lang-flag">
                        </button>
                        <button type="button" class="lang-tab" data-lang="EN" aria-label="English">
                            <img src="assets/united-kingdom.png" alt="EN" class="lang-flag">
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <h1 class="page-title" data-i18n="cab_title">Անձնական<br><span>Էջ</span></h1>

        <div class="form-card" style="text-align: center; margin-bottom: 24px; padding: 20px;">
            <div style="font-size: 11px; font-weight: 800; color: var(--text-sec); text-transform: uppercase;" data-i18n="cab_id">Ձեր բանալին (ID)՝</div>
            <div class="modal-id-highlight" id="client-id-display" style="font-size: 28px; margin-top: 10px; border: none; background: rgba(35, 169, 91, 0.15);">...</div>
        </div>

        <a href="index.html" class="submit-btn" style="text-align:center; display:block; text-decoration:none; margin-bottom: 32px;" data-i18n="cab_new_order">Նոր պատվեր ստեղծել</a>

        <div class="grid-title" data-i18n="cab_history_title">Պատվերների պատմություն</div>

        <div class="form-card" style="padding: 18px; margin-bottom: 16px;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 12px; align-items: center;">
                <span style="font-size:12px; font-weight:900; color:var(--text-sec); padding: 4px 8px; background: rgba(128,128,128,0.1); border-radius: 8px;">#ORD-982</span>
                <span style="font-size:11px; font-weight:800; color:var(--tree-light); display: flex; align-items: center; gap: 4px;">
                    <span style="display:block; width:8px; height:8px; background:var(--tree-light); border-radius:50%;"></span> Ավարտված է
                </span>
            </div>
            
            <div style="font-size:14px; font-weight:800; margin-bottom: 16px; line-height: 1.4;">
                Установка межкомнатных дверей (2 шт.), Демонтаж
            </div>
            
            <div style="display: flex; align-items: center; gap: 14px; background: rgba(128,128,128,0.05); padding: 12px; border-radius: 16px; border: 1px solid rgba(128,128,128,0.1);">
                <img src="https://i.pravatar.cc/150?img=11" alt="Master" style="width: 54px; height: 54px; border-radius: 50%; object-fit: cover; border: 2px solid var(--tree-light); box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
                <div style="flex: 1;">
                    <div style="font-size:13px; font-weight:900;">Арам Хачатрян</div>
                    <div style="font-size:10px; font-weight:700; color:var(--text-sec); margin-top: 2px;">Мастер по дверям</div>
                </div>
                <a href="tel:+37400000000" style="width: 40px; height: 40px; border-radius: 50%; background: var(--tree-light); color: #fff; display: flex; justify-content: center; align-items: center; text-decoration: none; box-shadow: 0 4px 10px rgba(35, 169, 91, 0.3);">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                </a>
            </div>
            
            <button class="submit-btn" style="padding: 14px; margin-top: 16px; font-size:12px; background: transparent; border: 1px solid var(--tree-light); color: var(--tree-light); box-shadow: none;" data-i18n="cab_rate">Գնահատել որակը</button>
        </div>

        <button id="logout-btn" class="submit-btn" style="background: rgba(255, 71, 87, 0.1); color: #ff4757; border: 1px solid rgba(255, 71, 87, 0.3); box-shadow: none; margin-top: 20px;" data-i18n="cab_logout">Դուրս գալ</button>
    </div>

    <!-- НИЖНЯЯ НАВИГАЦИЯ -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item" id="nav-orders">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            <span data-i18n="nav_orders">Պատվերներ</span>
        </a>
        <a href="jobs.html" class="nav-item" id="nav-jobs">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
            <span data-i18n="nav_jobs">Աշխատանք</span>
        </a>
        <a href="#" class="nav-item" id="nav-cabinet">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span data-i18n="nav_cabinet">Անձն. էջ</span>
        </a>
    </nav>

    <script src="main.js"></script>
</body>
</html>
