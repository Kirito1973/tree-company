<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TREE COMPANY - Թողնել հայտ</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#EBF1EC" id="themeColorMeta">

    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
    <link rel="manifest" href="manifest.json">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&family=Noto+Sans+Armenian:wght@500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="noise-overlay"></div>
    <div class="ambient-glow"></div>

    <div class="app-container">
        
        <header class="app-header">
            <div class="header-controls">
                <div class="lang-switcher" id="lang-switcher">
                    <button class="lang-btn-main" id="current-lang-btn" aria-label="Выбрать язык" type="button">
                        <img src="assets/free-icon-armenia-197516.png" alt="AM" class="lang-flag">
                    </button>
                    <div class="lang-dropdown-content">
                        <button type="button" class="lang-tab active" data-lang="AM" aria-label="Armenian">
                            <img src="assets/free-icon-armenia-197516.png" alt="AM" class="lang-flag">
                        </button>
                        <button type="button" class="lang-tab" data-lang="RU" aria-label="Russian">
                            <img src="assets/free-icon-russia-9994030.png" alt="RU" class="lang-flag">
                        </button>
                        <button type="button" class="lang-tab" data-lang="EN" aria-label="English">
                            <img src="assets/united-kingdom.png" alt="EN" class="lang-flag">
                        </button>
                    </div>
                </div>

                <button class="theme-btn" id="theme-btn" aria-label="Сменить тему">
                    <span class="theme-icon" id="theme-icon"></span>
                </button>
            </div>
            <div class="header-logo-container"><img src="assets/tree.svg" alt="Tree Logo" class="main-logo"></div>
            <div style="width: 48px;"></div>
        </header>

        <h1 class="page-title" data-i18n="resume_title">Լրացրեք<br><span>Ձեր հայտը</span></h1>

        <form id="apply-form" class="form-card" action="#">
            
            <div class="input-group">
                <label class="input-label" for="name" data-i18n="lbl_name">Անուն Ազգանուն *</label>
                <input type="text" id="name" class="glass-input" data-i18n-placeholder="pl_name" placeholder="Օրինակ՝ Արմեն Արմենյան" required>
            </div>

            <div class="input-row">
                <div class="input-group">
                    <label class="input-label" for="birth_date" data-i18n="lbl_year">Ծննդյան ամսաթիվ *</label>
                    <input type="date" id="birth_date" class="glass-input" required>
                </div>

                <div class="input-group">
                    <label class="input-label" for="experience" data-i18n="lbl_exp">Փորձ (տարի) *</label>
                    <input type="number" id="experience" class="glass-input" data-i18n-placeholder="pl_exp" placeholder="Օր.՝ 3" min="0" required>
                </div>
            </div>

            <div class="input-group">
                <label class="input-label" for="phone" data-i18n="lbl_phone">Հեռախոսահամար *</label>
                <input type="tel" id="phone" class="glass-input" data-i18n-placeholder="pl_phone" placeholder="+374 00 000 000" required>
            </div>

            <div class="input-group">
                <label class="input-label" for="profession" data-i18n="lbl_prof">Ի՞նչ մասնագետ եք (կատարվող աշխատանքը) *</label>
                <input type="text" id="profession" class="glass-input" data-i18n-placeholder="pl_prof" placeholder="Օրինակ՝ Դռան և լամինատի վարպետ" required>
            </div>

            <div class="input-group">
                <label class="input-label" for="price" data-i18n="lbl_price">Ծառայությունների արժեքը (գներ) *</label>
                <input type="text" id="price" class="glass-input" data-i18n-placeholder="pl_price" placeholder="Օրինակ՝ 5000-15000֏, կամ նշեք պայմանները" required>
            </div>

            <div class="input-group">
                <label class="input-label" data-i18n="lbl_schedule">Աշխատանքային գրաֆիկ *</label>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <span style="font-size: 14px; font-weight: 700; opacity: 0.8;">Սկսած՝</span>
                    <input type="time" id="time_start" class="glass-input" style="flex: 1;" required>
                    <span style="font-size: 14px; font-weight: 700; opacity: 0.8;">Մինչև՝</span>
                    <input type="time" id="time_end" class="glass-input" style="flex: 1;" required>
                </div>
            </div>

            <div class="input-group">
                <label class="input-label" for="employment" data-i18n="lbl_emp">Զբաղվածություն և պայմաններ *</label>
                <select id="employment" class="glass-input" required>
                    <option value="" disabled selected data-i18n="opt_1">Ընտրեք տարբերակը...</option>
                    <option value="full_time" data-i18n="opt_2">Դիտարկում եմ որպես հիմնական աշխատանք (լրիվ դրույք)</option>
                    <option value="part_time" data-i18n="opt_3">Ունեմ այլ աշխատանք (համատեղություն / կես դրույք)</option>
                    <option value="open" data-i18n="opt_4">Այլ տարբերակ (կմանրամասնեմ ներքևում)</option>
                </select>
            </div>

            <div class="input-group">
                <label class="input-label" for="message" data-i18n="lbl_msg">Այլ լրացուցիչ տեղեկություններ</label>
                <textarea id="message" class="glass-input" data-i18n-placeholder="pl_msg" placeholder="Այստեղ կարող եք գրել այն ամենը, ինչը կարևոր եք համարում նշել..."></textarea>
            </div>

            <button type="submit" class="submit-btn" data-i18n="submit_resume">Ուղարկել հայտը</button>
        </form>

    </div>

    <!-- НИЖНЯЯ НАВИГАЦИЯ -->
    <nav class="bottom-nav">
        <a href="index.html" class="tab-item" id="tab-home">
            <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            <span data-i18n="nav_home">Գլխավոր</span>
        </a>
        <a href="jobs.html" class="tab-item active" id="tab-jobs">
            <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
            <span data-i18n="nav_jobs">Աշխատանք</span>
        </a>
        <a href="account.html" class="tab-item" id="tab-account">
            <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span data-i18n="nav_account">Իմ էջը</span>
        </a>
    </nav>

    <script src="main.js"></script>
</body>
</html>
