<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TREE COMPANY - Անկետա (Анкета)</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#EBF1EC" id="themeColorMeta">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&family=Noto+Sans+Armenian:wght@500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <style>
        .form-wrapper {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 24px;
            margin-top: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.05);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        
        :root[data-theme="dark"] .form-wrapper {
            background: rgba(30, 30, 30, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            font-size: 14px;
            color: inherit;
        }

        .form-group input, 
        .form-group textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 12px;
            font-family: inherit;
            font-size: 16px;
            background: rgba(255,255,255,0.9);
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus, 
        .form-group textarea:focus {
            border-color: #23A95B;
        }

        :root[data-theme="dark"] .form-group input, 
        :root[data-theme="dark"] .form-group textarea {
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
        }

        .time-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .time-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .time-item span {
            font-size: 12px;
            font-weight: 600;
            opacity: 0.8;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: #23A95B;
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 10px;
            font-family: inherit;
            box-shadow: 0 4px 15px rgba(35, 169, 91, 0.3);
            transition: transform 0.1s, background 0.3s;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .back-nav {
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            color: inherit;
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 20px;
            padding: 8px 12px;
            background: rgba(0,0,0,0.05);
            border-radius: 10px;
            transition: background 0.3s;
        }
        
        :root[data-theme="dark"] .back-nav {
            background: rgba(255,255,255,0.1);
        }

        .back-nav svg {
            margin-right: 8px;
        }
    </style>
</head>
<body>

    <div class="noise-overlay"></div>
    <div class="ambient-glow"></div>

    <div class="app-container">
        
        <header class="app-header">
            <div class="header-controls">
                <div class="lang-switcher" id="lang-switcher" style="visibility: hidden;">
                    <button class="lang-btn-main" id="current-lang-btn" type="button"></button>
                </div>
                <button class="theme-btn" id="theme-btn" aria-label="Сменить тему">
                    <span class="theme-icon" id="theme-icon"></span>
                </button>
            </div>
            <div class="header-logo-container"><img src="assets/tree.svg" alt="Tree Logo" class="main-logo"></div>
            <div style="width: 48px;"></div>
        </header>

        <div class="form-wrapper">
            <!-- Кнопка назад ведет на jobs.html -->
            <a href="jobs.html" class="back-nav">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
                <span data-i18n="back_btn">Հետ / Назад</span>
            </a>

            <div class="grid-title" data-i18n="job_title" style="margin-top: 0; text-align: left; padding-left: 0;">Անկետա / Анкета</div>

            <form id="jobsForm">
                <!-- Скрытое поле для сохранения должности -->
                <input type="hidden" id="professionField" value="">

                <div class="form-group">
                    <label for="fullName" data-i18n="label_name">ԱԱՀ (ФИО)</label>
                    <input type="text" id="fullName" placeholder="Иванов Иван" required>
                </div>

                <div class="form-group">
                    <label for="phone" data-i18n="label_phone">Հեռախոսահամար (Телефон)</label>
                    <input type="tel" id="phone" value="+374 " required>
                </div>

                <div class="form-group">
                    <label for="birthDate" data-i18n="label_birthdate">Ծննդյան ամսաթիվ (Дата рождения)</label>
                    <input type="date" id="birthDate" required>
                </div>

                <div class="form-group">
                    <label data-i18n="label_schedule">Աշխատանքային ժամեր (Желаемые часы)</label>
                    <div class="time-group">
                        <div class="time-item">
                            <span data-i18n="time_from">Սկսած (С)</span>
                            <input type="time" id="workTimeStart" required>
                        </div>
                        <div class="time-item">
                            <span data-i18n="time_to">Մինչև (До)</span>
                            <input type="time" id="workTimeEnd" required>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="experience" data-i18n="label_experience">Աշխատանքային փորձ (Опыт работы)</label>
                    <textarea id="experience" rows="3" placeholder="Опишите ваши навыки..."></textarea>
                </div>

                <button type="submit" class="submit-btn" data-i18n="btn_submit">Ուղարկել հայտը / Отправить</button>
            </form>
        </div>

    </div>

    <script src="main.js"></script>
    
    <script>
        // Получаем профессию из ссылки (если перешли по form.html?prof=door_master)
        document.addEventListener("DOMContentLoaded", function() {
            const urlParams = new URLSearchParams(window.location.search);
            const prof = urlParams.get('prof') || 'Не указана';
            document.getElementById('professionField').value = prof;
        });

        // Обработка отправки формы
        document.getElementById('jobsForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const profession = document.getElementById('professionField').value;
            const fullName = document.getElementById('fullName').value;
            const phone = document.getElementById('phone').value;
            const birthDate = document.getElementById('birthDate').value;
            const timeStart = document.getElementById('workTimeStart').value;
            const timeEnd = document.getElementById('workTimeEnd').value;
            const experience = document.getElementById('experience').value;

            const preferredSchedule = `${timeStart} - ${timeEnd}`;

            const applicationData = {
                profession: profession, // Передаем, на какую должность отклик
                fullName: fullName,
                phone: phone,
                birthDate: birthDate,
                preferredSchedule: preferredSchedule,
                experience: experience,
                status: 'new' 
            };

            console.log('Анкета готова для бэкенда:', applicationData);
            alert('Ваша заявка успешно сформирована!');
            this.reset();
        });
    </script>
</body>
</html>
