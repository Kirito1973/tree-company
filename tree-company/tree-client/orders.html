<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TREE COMPANY - Ծառայություններ</title>
    <meta name="theme-color" content="#EBF1EC" id="themeColorMeta">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
    <link rel="manifest" href="manifest.json">
    <script>
        (function() {
            try {
                var savedTheme = localStorage.getItem('app_theme');
                var systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) document.documentElement.classList.add('force-dark');
                else if (savedTheme === 'light' || (!savedTheme && !systemPrefersDark)) document.documentElement.classList.add('force-light');
            } catch (e) {}
        })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&family=Noto+Sans+Armenian:wght@500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="noise-overlay"></div><div class="ambient-glow"></div>
    <div class="app-container">
        
        <header class="app-header">
            <div class="header-left">
                <button class="back-btn" onclick="window.location.href='index.html'" aria-label="Հետ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
                <button class="theme-btn" id="theme-btn"><span class="theme-icon" id="theme-icon"></span></button>
            </div>
            <div class="header-logo-container"><img src="assets/tree.svg" alt="Tree Logo" class="main-logo"></div>
            <div class="header-right">
                <div class="lang-switcher" id="lang-switcher">
                    <button class="lang-btn-main" id="current-lang-btn" type="button"><img src="assets/free-icon-armenia-197516.png" alt="AM" class="lang-flag"></button>
                    <div class="lang-dropdown-content">
                        <button type="button" class="lang-tab active" data-lang="AM"><img src="assets/free-icon-armenia-197516.png" class="lang-flag"></button>
                        <button type="button" class="lang-tab" data-lang="RU"><img src="assets/free-icon-russia-9994030.png" class="lang-flag"></button>
                        <button type="button" class="lang-tab" data-lang="EN"><img src="assets/united-kingdom.png" class="lang-flag"></button>
                    </div>
                </div>
            </div>
        </header>

        <a href="tel:+37495188038" class="promo-banner">
            <span class="promo-subtitle" data-i18n="promo_sub">ՄԵՆՔ ԳՆԱՀԱՏՈՒՄ ԵՆՔ ՁԵԶ</span>
            <span class="promo-title" data-i18n="promo_title">Պատվիրեք հավելվածով և ստացեք <span class="promo-highlight">10% զեղչ</span> հենց հիմա</span>
        </a>

        <div class="grid-title" data-i18n="title_services">Ծառայություններ</div>

        <div class="services-grid">
            <a href="order-doors.html" class="service-card">
                <div class="service-icon"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18"/><path d="M6 22h12"/><path d="M4 22h16"/><path d="M14 12h.01"/></svg></div>
                <div class="service-name" data-i18n="door_install">Դռների<br>տեղադրում</div>
                <div class="service-phone-badge" data-i18n="order_master">→ Պատվիրել վարպետ</div>
            </a>
            <a href="order-baseboards.html" class="service-card">
                <div class="service-icon"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 21H3V3"/><path d="M21 17H7v4"/><path d="M11 17v4"/><path d="M15 17v4"/></svg></div>
                <div class="service-name" data-i18n="baseboard_install">Պլինտուսների<br>տեղադրում</div>
                <div class="service-phone-badge" data-i18n="order_master">→ Պատվիրել վարպետ</div>
            </a>
            
            <div class="service-card coming-soon"><div class="service-icon"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 22h14"/><path d="M5 2h14"/><path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22"/><path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2"/></svg></div><div class="service-name" data-i18n="coming_soon">Շուտով</div><div class="service-phone-badge" data-i18n="wait">Սպասեք</div></div>
            <div class="service-card coming-soon"><div class="service-icon"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 22h14"/><path d="M5 2h14"/><path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22"/><path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2"/></svg></div><div class="service-name" data-i18n="coming_soon">Շուտով</div><div class="service-phone-badge" data-i18n="wait">Սպասեք</div></div>
        </div>

        <div class="contact-section">
            <div class="contact-title" data-i18n="contact_title">Կապվեք մեզ հետ Ձեզ հարմար եղանակով</div>
            <div class="social-icons">
                <a href="tel:+37495188038" class="social-btn"><svg viewBox="0 0 24 24" width="28" height="28"><circle cx="12" cy="12" r="12" fill="#23A95B"/><path fill="#FFF" d="M16 13l-2.2 2.2c-2.4-1.2-4.4-3.2-5.6-5.6L10.4 7.4c.3-.3.4-.8.1-1.1L8.3 3.6c-.3-.3-.8-.3-1.1 0L5.3 5.5C5 5.8 4.9 6.2 5 6.6c.6 3.6 2.5 6.9 5.2 9.6 2.7 2.7 6 4.6 9.6 5.2.4.1.8-.1 1.1-.4l1.9-1.9c.3-.3.3-.8 0-1.1l-2.7-2.2c-.3-.2-.8-.2-1.1.1z"/></svg></a>
            </div>
        </div>
