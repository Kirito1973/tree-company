<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>TREE Admin</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#F4F7F5" id="themeColorMeta">

    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
    <link rel="manifest" href="manifest.json">

    <script>
        (function() {
            try {
                var savedTheme = localStorage.getItem('admin_theme');
                if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                } else {
                    document.documentElement.setAttribute('data-theme', 'light');
                }
            } catch (e) {}
        })();
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&family=Noto+Sans+Armenian:wght@500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="privacy-overlay" class="privacy-overlay">
        <img src="assets/tree.png" alt="Tree" style="width: 80px; opacity: 0.8;">
    </div>

    <!-- КРАСИВЫЙ ЭКРАН ВХОДА -->
    <div id="auth-screen" class="auth-overlay">
        <div class="auth-card glass-panel" style="position: relative; padding: 40px 30px; text-align: center;">
            <div class="header-logo-container" style="width: 80px; margin: 0 auto 20px auto;">
                <img src="assets/tree.png" alt="Tree Logo" class="main-logo">
            </div>
            
            <h2 class="screen-title" style="margin-bottom: 5px; font-size: 22px;">Բարի գալուստ</h2>
            <p style="font-size: 12px; color: var(--text-sec); margin-bottom: 30px; font-weight: 600;">Добро пожаловать, Администратор</p>
            
            <div style="width:100%; position: relative;">
                <input type="password" id="pin-input" class="glass-input" placeholder="Գաղտնաբառ (Пароль)" style="text-align: center; font-size: 16px; letter-spacing: 4px; padding: 18px; border-radius: 20px; padding-right: 50px;">
                <button id="toggle-password-btn" style="position: absolute; right: 15px; top: 18px; background: transparent; border: none; color: var(--text-sec); cursor: pointer; display: flex; align-items: center; justify-content: center; height: 24px; padding: 0;">
                    <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px;">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
                <button id="login-submit-btn" class="submit-btn success" style="margin-top: 15px; border-radius: 20px; font-size: 14px;">Մուտք (Войти)</button>
            </div>

            <div style="display: flex; align-items: center; width: 100%; margin: 25px 0;">
                <div style="flex: 1; height: 1px; background: rgba(128,128,128,0.2);"></div>
                <span style="font-size: 10px; color: var(--text-sec); padding: 0 10px; text-transform: uppercase; font-weight: 800;">ԿԱՄ (ИЛИ)</span>
                <div style="flex: 1; height: 1px; background: rgba(128,128,128,0.2);"></div>
            </div>

            <button id="bio-scan-btn" class="bio-icon-btn" onclick="authenticateBiometric()" style="display: flex; flex-direction: column; align-items: center; background: transparent; border: none; cursor: pointer; width: 100%;">
                <div class="bio-icon-circle" id="bio-icon-circle">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M12 2a10 10 0 0 0-10 10v2a10 10 0 0 0 10 10 10 10 0 0 0 10-10v-2a10 10 0 0 0-10-10z"></path>
                        <path d="M8 12a4 4 0 0 1 8 0"></path>
                        <path d="M10 16a2 2 0 0 1 4 0"></path>
                        <path d="M6 12v2"></path>
                        <path d="M18 12v2"></path>
                    </svg>
                </div>
                <span style="font-size: 10px; color: var(--text); margin-top: 12px; font-weight: 800; text-transform: uppercase;">Touch ID</span>
            </button>
            
            <div id="auth-error" style="color: #ff4444; font-size: 11px; font-weight: bold; text-align: center; margin-top: 20px; opacity: 0; transition: opacity 0.3s;"></div>
        </div>
    </div>

    <div class="noise-overlay"></div>
    <div class="ambient-glow"></div>

    <div class="app-container">
        
        <header class="app-header">
            <button class="theme-btn" id="theme-btn" aria-label="Theme" onclick="toggleTheme(event)">
                <span class="theme-icon" id="theme-icon"></span>
            </button>
            <div class="header-logo-container">
                <img src="assets/tree.png" alt="Tree Logo" class="main-logo">
            </div>
            <!-- ВОССТАНОВЛЕННЫЙ ВЫБОР ЯЗЫКА -->
            <div class="lang-switcher" id="lang-switcher">
                <button class="lang-btn-main" id="current-lang-btn" type="button" onclick="toggleLangMenu(event)">
                    <img src="assets/free-icon-armenia-197516.png" class="lang-flag">
                </button>
                <div class="lang-dropdown-content">
                    <button type="button" class="lang-tab active" data-lang="AM" onclick="setAdminLang('AM', event)"><img src="assets/free-icon-armenia-197516.png" class="lang-flag"></button>
                    <button type="button" class="lang-tab" data-lang="RU" onclick="setAdminLang('RU', event)"><img src="assets/free-icon-russia-9994030.png" class="lang-flag"></button>
                    <button type="button" class="lang-tab" data-lang="EN" onclick="setAdminLang('EN', event)"><img src="assets/united-kingdom.png" class="lang-flag"></button>
                </div>
            </div>
        </header>

        <section class="admin-screen active" id="screen-dashboard">
            <h2 class="screen-title" data-i18n="tab_dashboard">Գլխավոր</h2>
            <div class="dash-switcher">
                <button class="dash-tab dash-view-btn active" data-dash-view="overview" onclick="switchDashboardView('overview')">
                    <div class="notif-dot" id="dash-dot-overview" style="display:none;"></div>
                    <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
                </button>
                <button class="dash-tab dash-view-btn" data-dash-view="orders" onclick="switchDashboardView('orders')">
                    <div class="notif-dot" id="dash-dot-orders" style="display:none;"></div>
                    <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
                </button>
                <button class="dash-tab dash-view-btn" data-dash-view="masters" onclick="switchDashboardView('masters')">
                    <div class="notif-dot" id="dash-dot-masters" style="display:none;"></div>
                    <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                </button>
                <button class="dash-tab dash-view-btn" data-dash-view="partners" onclick="switchDashboardView('partners')">
                    <div class="notif-dot" id="dash-dot-partners" style="display:none;"></div>
                    <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path><line x1="12" y1="11" x2="12" y2="13"></line></svg>
                </button>
            </div>

            <div id="dash-overview" class="dash-view-content">
                <div id="dash-avg-rating-hero" class="rating-hero">★ 0.0</div>
                <div class="glass-panel">
                    <h3 class="input-label" data-i18n="lbl_recent_reviews">Վերջին կարծիքները</h3>
                    <div class="entity-list" id="dash-reviews-list"></div>
                </div>
            </div>
            <div id="dash-orders" class="dash-view-content" style="display:none;">
                <div class="glass-panel">
                    <h3 class="input-label" data-i18n="lbl_new_requests">Նոր հայտեր</h3>
                    <div class="entity-list" id="dash-orders-list"></div>
                </div>
            </div>
            <div id="dash-masters" class="dash-view-content" style="display:none;">
                <div class="glass-panel">
                    <h3 class="input-label" data-i18n="sw_inc_masters">Նոր աշխատակիցներ</h3>
                    <div class="entity-list" id="dash-masters-list"></div>
                </div>
            </div>
            <div id="dash-partners" class="dash-view-content" style="display:none;">
                <div class="glass-panel">
                    <h3 class="input-label" data-i18n="lbl_new_partners">Նոր գործընկերներ</h3>
                    <div class="entity-list" id="dash-partners-requests-list"></div>
                </div>
            </div>
        </section>

        <!-- МАКЕТ ФИНАНСОВ -->
        <section class="admin-screen" id="screen-finance">
            <h2 class="screen-title" data-i18n="tab_finance">Ֆինանսներ</h2>
            
            <div class="stats-grid" style="margin-bottom: 16px;">
                <div class="stat-box">
                    <div class="stat-label">Ընդհանուր եկամուտ</div>
                    <div class="stat-value" id="fin-total-income">0 ֏</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Վարպետների պարտքը</div>
                    <div class="stat-value" id="fin-total-debt" style="color: #ff4444;">0 ֏</div>
                </div>
            </div>

            <div class="glass-panel">
                <h3 class="input-label">Վերջին գործարքները</h3>
                <div class="entity-list" id="fin-transactions-list">
                    <div style="text-align:center; font-size: 11px; color: var(--text-sec); padding: 10px;">Դեռ գործարքներ չկան</div>
                </div>
            </div>
        </section>

        <!-- Остальные секции экрана -->
        <section class="admin-screen" id="screen-orders"></section>
        <section class="admin-screen" id="screen-employees"></section>
        <section class="admin-screen" id="screen-partners"></section>
        <section class="admin-screen" id="screen-clients"></section>
        <section class="admin-screen" id="screen-management"></section>
        <div id="modals-container"></div>

    </div>

    <!-- КНОПКИ NAV -->
    <nav class="bottom-nav">
        <button class="tab-item active" onclick="switchTab('screen-dashboard', this)">
            <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            <span data-i18n="tab_dashboard">Գլխավոր</span>
        </button>
        <button class="tab-item" onclick="switchTab('screen-orders', this)">
            <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg>
            <span data-i18n="tab_orders">Պատվերներ</span>
        </button>
        <button class="tab-item" onclick="switchTab('screen-finance', this)">
            <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
            <span data-i18n="tab_finance">Ֆինանսներ</span>
        </button>
        <button class="tab-item" onclick="switchTab('screen-employees', this)">
            <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span data-i18n="tab_employees">Կադրեր</span>
        </button>
        <button class="tab-item" onclick="switchTab('screen-partners', this)">
            <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"></path></svg>
            <span data-i18n="tab_partners">Գործընկ.</span>
        </button>
        <button class="tab-item" onclick="switchTab('screen-clients', this)">
            <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
            <span data-i18n="tab_clients">Հաճախորդ</span>
        </button>
        <button class="tab-item" onclick="switchTab('screen-management', this)">
            <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            <span data-i18n="tab_management">Կառավար.</span>
        </button>
    </nav>

    <script src="js/core.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/orders.js"></script>
    <script src="js/finance.js"></script>
    <script src="js/employees.js"></script>
    <script src="js/partners.js"></script>
    <script src="js/clients.js"></script>
    <script src="js/management.js"></script>
</body>
</html>
