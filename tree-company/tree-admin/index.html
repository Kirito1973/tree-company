<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>TREE Admin - Modular</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#F4F7F5" id="themeColorMeta">

    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
    <link rel="manifest" href="manifest.json">

    <script>
        (function() {
            try {
                var savedTheme = localStorage.getItem('admin_theme');
                if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                } else {
                    document.documentElement.setAttribute('data-theme', 'light');
                }
            } catch (e) {}
        })();
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&family=Noto+Sans+Armenian:wght@500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="privacy-overlay" class="privacy-overlay">
        <img src="assets/tree.png" alt="Tree" style="width: 80px; opacity: 0.8;">
    </div>

    <div id="auth-screen" class="auth-overlay">
        <div class="auth-card glass-panel">
            <div class="header-logo-container" style="width: 80px; margin-bottom: 20px;">
                <img src="assets/tree.png" alt="Tree Logo" class="main-logo">
            </div>
            <h2 class="screen-title" style="margin-bottom: 10px; font-size: 20px;">Մուտք <br><span style="font-size: 14px; color: var(--text-sec);">(Вход)</span></h2>
            <p style="font-size: 10px; color: var(--text-sec); margin-bottom: 24px; text-align: center; font-weight: 600;">Մուտքագրեք PIN կոդը<br>(Введите пароль)</p>
            <input type="password" id="pin-input" class="glass-input" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="••••••" style="text-align: center; font-size: 32px; letter-spacing: 12px; padding: 20px; font-family: monospace;">
            <div id="auth-error" style="color: #ff4444; font-size: 11px; font-weight: bold; text-align: center; margin-top: 16px; opacity: 0; transition: opacity 0.3s;">Սխալ PIN (Неверный пароль)</div>
        </div>
    </div>

    <div class="noise-overlay"></div>
    <div class="ambient-glow"></div>

    <div class="app-container">
        
        <header class="app-header">
            <button class="theme-btn" id="theme-btn" aria-label="Theme" onclick="toggleTheme(event)">
                <span class="theme-icon" id="theme-icon"></span>
            </button>
            <div class="header-logo-container">
                <img src="assets/tree.png" alt="Tree Logo" class="main-logo">
            </div>
            <div class="lang-switcher" id="lang-switcher">
                <button class="lang-btn-main" id="current-lang-btn" type="button" onclick="toggleLangMenu(event)">
                    <img src="assets/free-icon-armenia-197516.png" class="lang-flag">
                </button>
                <div class="lang-dropdown-content">
                    <button type="button" class="lang-tab active" data-lang="AM" onclick="setAdminLang('AM', event)"><img src="assets/free-icon-armenia-197516.png" class="lang-flag"></button>
                    <button type="button" class="lang-tab" data-lang="RU" onclick="setAdminLang('RU', event)"><img src="assets/free-icon-russia-9994030.png" class="lang-flag"></button>
                    <button type="button" class="lang-tab" data-lang="EN" onclick="setAdminLang('EN', event)"><img src="assets/united-kingdom.png" class="lang-flag"></button>
                </div>
            </div>
        </header>

        <section class="admin-screen active" id="screen-dashboard">
            <h2 class="screen-title" data-i18n="tab_dashboard">Գլխավոր</h2>
            <div class="dash-switcher">
                <button class="dash-tab dash-view-btn active" data-dash-view="overview" onclick="switchDashboardView('overview')">
                    <div class="notif-dot" id="dash-dot-overview" style="display:none;"></div>
                    <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
                </button>
                <button class="dash-tab dash-view-btn" data-dash-view="orders" onclick="switchDashboardView('orders')">
                    <div class="notif-dot" id="dash-dot-orders" style="display:none;"></div>
                    <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
                </button>
                <button class="dash-tab dash-view-btn" data-dash-view="masters" onclick="switchDashboardView('masters')">
                    <div class="notif-dot" id="dash-dot-masters" style="display:none;"></div>
                    <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                </button>
                <button class="dash-tab dash-view-btn" data-dash-view="partners" onclick="switchDashboardView('partners')">
                    <div class="notif-dot" id="dash-dot-partners" style="display:none;"></div>
                    <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path><line x1="12" y1="11" x2="12" y2="13"></line></svg>
                </button>
            </div>

            <div id="dash-overview" class="dash-view-content">
                <div id="dash-avg-rating-hero" class="rating-hero">★ 0.0</div>
                <div class="glass-panel">
                    <h3 class="input-label" data-i18n="lbl_recent_reviews">Վերջին կարծիքները</h3>
                    <div class="entity-list" id="dash-reviews-list"></div>
                </div>
            </div>
            <div id="dash-orders" class="dash-view-content" style="display:none;">
                <div class="glass-panel">
                    <h3 class="input-label" data-i18n="lbl_new_requests">Նոր հայտեր</h3>
                    <div class="entity-list" id="dash-orders-list"></div>
                </div>
            </div>
            <div id="dash-masters" class="dash-view-content" style="display:none;">
                <div class="glass-panel">
                    <h3 class="input-label" data-i18n="sw_inc_masters">Նոր աշխատակիցներ</h3>
                    <div class="entity-list" id="dash-masters-list"></div>
                </div>
            </div>
            <div id="dash-partners" class="dash-view-content" style="display:none;">
                <div class="glass-panel">
                    <h3 class="input-label" data-i18n="lbl_new_partners">Նոր գործընկերներ</h3>
                    <div class="entity-list" id="dash-partners-requests-list"></div>
                </div>
            </div>
        </section>

        <section class="admin-screen" id="screen-orders">
            <button class="fab-btn" onclick="openOrderForm()" aria-label="Add Order">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
            <h2 class="screen-title" data-i18n="tab_orders">Պատվերներ</h2>
            
            <div class="glass-panel" style="padding: 14px 20px; margin-bottom: 12px;">
                <div class="search-container">
                    <svg class="search-icon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16" y2="16"></line></svg>
                    <input type="text" class="glass-input search-input" id="order-search" data-i18n-placeholder="pl_search_order" placeholder="Որոնել (ID, Անուն, Հեռախոս)...">
                </div>
            </div>

            <!-- Минималистичные иконки с бейджиками -->
            <div class="icon-filters-container">
                <button class="icon-filter active" data-filter="all" onclick="setOrderFilter('all')">
                    <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
                    <span class="filter-count" id="count-all">0</span>
                </button>
                <button class="icon-filter" data-filter="new" onclick="setOrderFilter('new')">
                    <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
                    <span class="filter-count" id="count-new">0</span>
                </button>
                <button class="icon-filter" data-filter="progress" onclick="setOrderFilter('progress')">
                    <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    <span class="filter-count" id="count-progress">0</span>
                </button>
                <button class="icon-filter" data-filter="completed" onclick="setOrderFilter('completed')">
                    <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    <span class="filter-count" id="count-completed">0</span>
                </button>
                <button class="icon-filter" data-filter="cancelled" onclick="setOrderFilter('cancelled')">
                    <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    <span class="filter-count" id="count-cancelled">0</span>
                </button>
            </div>
            
            <div class="entity-list" id="orders-list"></div>
        </section>

        <!-- (Остальные экраны: screen-finance, screen-employees, screen-partners, screen-clients, screen-management) ОСТАЮТСЯ БЕЗ ИЗМЕНЕНИЙ, ТЫ ИХ СКОПИРУЕШЬ ИЗ СВОЕГО ПРОЕКТА-->

        <!-- КОНТЕЙНЕР ДЛЯ ВСЕХ МОДАЛЬНЫХ ОКОН -->
        <div id="modals-container">
            
            <div id="order-modal" class="modal-overlay" onclick="closeOrderModal()">
                <div class="modal-content glass-panel modal-scroll" onclick="event.stopPropagation()">
                    <div class="entity-header" style="margin-bottom:10px;">
                        <span id="modal-order-id" style="font-size: 16px; font-weight: 900; color: var(--tree-light);"></span>
                        <span id="modal-order-status" class="entity-status"></span>
                    </div>
                    <div class="detail-block">
                        <div class="detail-row"><span class="detail-label" data-i18n="lbl_date_created">Создан:</span><span id="modal-date-created" class="detail-value"></span></div>
                        <div class="detail-row" id="modal-date-completed-wrapper"><span class="detail-label" data-i18n="lbl_date_completed">Завершен:</span><span id="modal-date-completed" class="detail-value"></span></div>
                    </div>
                    <h3 class="input-label" style="margin-top:10px;" data-i18n="lbl_client_details">Клиент</h3>
                    <div class="detail-block">
                        <div class="detail-row"><span class="detail-label" data-i18n="lbl_name">Имя:</span><span id="modal-client-name" class="detail-value"></span></div>
                        <div class="detail-row"><span class="detail-label" data-i18n="lbl_phone">Тел:</span><span class="detail-value"><span id="modal-client-phone-text"></span><a id="modal-client-phone-link" class="call-btn"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg></a></span></div>
                        <div class="detail-row"><span class="detail-label" data-i18n="lbl_address">Адрес:</span><span id="modal-client-address" class="detail-value"></span></div>
                    </div>
                    <h3 class="input-label" style="margin-top:10px;" data-i18n="lbl_worker_details">Сотрудник</h3>
                    <div class="detail-block">
                        <div class="detail-row"><span class="detail-label" data-i18n="lbl_name">Имя:</span><span id="modal-worker-name" class="detail-value"></span></div>
                        <div class="detail-row"><span class="detail-label" data-i18n="lbl_phone">Тел:</span><span class="detail-value"><span id="modal-worker-phone-text"></span><a id="modal-worker-phone-link" class="call-btn"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg></a></span></div>
                    </div>
                    <h3 class="input-label" style="margin-top:10px;" data-i18n="lbl_services">Услуги</h3>
                    <div class="detail-block" id="modal-services-list" style="display:flex; flex-direction:column; gap:8px;"></div>
                    <div class="detail-block" style="background: rgba(31, 150, 81, 0.1); border-color: rgba(31, 150, 81, 0.2);">
                        <div class="detail-row"><span class="detail-label" data-i18n="lbl_total">Итого:</span><span id="modal-total-price" class="detail-value" style="font-size:16px;"></span></div>
                        <div class="detail-row"><span class="detail-label" data-i18n="lbl_profit">Прибыль:</span><span id="modal-company-profit" class="detail-value" style="color:var(--tree-light);"></span></div>
                    </div>
                    
                    <!-- Сетка кнопок -->
                    <div class="modal-actions-grid" id="modal-actions-container">
                        <button id="modal-accept-btn" class="modal-btn success" onclick="acceptOrder()" data-i18n="btn_accept_order">Принять</button>
                        <button id="modal-reject-btn" class="modal-btn danger" onclick="rejectOrder()" data-i18n="btn_reject_order">Отказать</button>
                        <button id="modal-edit-btn" class="modal-btn primary" onclick="openOrderForm(window.currentActiveOrderId)" data-i18n="btn_edit_order">Изменить</button>
                        <button id="modal-cancel-btn" class="modal-btn danger" onclick="cancelOrder()" data-i18n="btn_cancel_order">Отменить</button>
                    </div>
                    <button class="modal-btn secondary" onclick="closeOrderModal()" data-i18n="btn_close" style="margin-top:10px;">Закрыть</button>
                </div>
            </div>
            
            <!-- ОСТАЛЬНЫЕ МОДАЛКИ (review-modal, coop-modal, employee-form-modal и т.д.) ОСТАВЛЯЕШЬ СВОИ-->
        </div>
    </div>

    <!-- BOTTOM NAV ОСТАВЛЯЕШЬ СВОЙ -->
    <nav class="bottom-nav">
        <!-- Твой код меню -->
    </nav>

    <script src="js/core.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/orders.js"></script>
    <script src="js/finance.js"></script>
    <script src="js/employees.js"></script>
    <script src="js/partners.js"></script>
    <script src="js/clients.js"></script>
    <script src="js/management.js"></script>
</body>
</html>
