<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>TREE Admin</title>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#F4F7F5" id="themeColorMeta">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
    <link rel="manifest" href="manifest.json">
    <script>
        (function() {
            try {
                var savedTheme = localStorage.getItem('admin_theme');
                if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                } else {
                    document.documentElement.setAttribute('data-theme', 'light');
                }
                
                // Моментально прячем экран входа, если токен уже есть, чтобы не было мерцания
                if (localStorage.getItem('tree_secure_token') === 'valid') {
                    document.documentElement.style.setProperty('--auth-display', 'none');
                } else {
                    document.documentElement.style.setProperty('--auth-display', 'flex');
                }
            } catch (e) {}
        })();
    </script>
    <style>
        .auth-overlay { display: var(--auth-display, flex); }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Noto+Sans+Armenian:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="noise-overlay"></div>
    <div class="ambient-glow"></div>

    <div id="auth-screen" class="auth-overlay">
        <div class="auth-card glass-panel" style="position: relative; padding: 40px 30px; text-align: center;">
            <div class="header-logo-container" style="width: 80px; margin: 0 auto 20px auto;">
                <img src="assets/tree.png" alt="Tree Logo" class="main-logo">
            </div>
            <h2 class="screen-title" style="margin-bottom: 5px; font-size: 22px;" data-i18n="welcome"></h2>
            <p style="font-size: 12px; color: var(--text-sec); margin-bottom: 30px; font-weight: 600;" data-i18n="welcome_admin"></p>
            <div style="width:100%; position: relative;">
                <input type="password" id="pin-input" class="glass-input pin-input" data-i18n-placeholder="password_placeholder" style="text-align: center; font-size: 20px; letter-spacing: 8px; padding: 18px 45px 18px 18px; border-radius: 20px;" autocomplete="off">
                <button id="toggle-password-btn" type="button" style="position: absolute; right: 15px; top: 16px; background: transparent; border: none; color: var(--text-sec); cursor: pointer; display: flex; align-items: center; justify-content: center; height: 28px; width: 28px;">
                    <svg id="eye-icon-closed" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                    <svg id="eye-icon-open" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </button>
                <button id="login-submit-btn" class="submit-btn success" style="margin-top: 15px; border-radius: 20px; font-size: 14px; height: 52px;" data-i18n="login_btn"></button>
            </div>
            <div style="display: flex; align-items: center; width: 100%; margin: 25px 0;">
                <div style="flex: 1; height: 1px; background: var(--card-border);"></div>
                <span style="font-size: 10px; color: var(--text-sec); padding: 0 10px; text-transform: uppercase; font-weight: 800;" data-i18n="or_text"></span>
                <div style="flex: 1; height: 1px; background: var(--card-border);"></div>
            </div>
            <button id="bio-scan-btn" class="bio-icon-btn" onclick="authenticateBiometric()" style="display: flex; flex-direction: column; align-items: center; background: transparent; border: none; cursor: pointer; width: 100%;">
                <div class="bio-icon-circle" id="bio-icon-circle">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M12 2a10 10 0 0 0-10 10v2a10 10 0 0 0 10 10 10 10 0 0 0 10-10v-2a10 10 0 0 0-10-10z"></path>
                        <path d="M8 12a4 4 0 0 1 8 0"></path>
                        <path d="M10 16a2 2 0 0 1 4 0"></path>
                        <path d="M6 12v2"></path>
                        <path d="M18 12v2"></path>
                    </svg>
                </div>
                <span style="font-size: 10px; color: var(--text); margin-top: 12px; font-weight: 800; text-transform: uppercase;" data-i18n="touch_id"></span>
            </button>
            <div id="auth-error" style="color: var(--danger); font-size: 11px; font-weight: bold; text-align: center; margin-top: 20px; opacity: 0; transition: opacity 0.3s;"></div>
        </div>
    </div>

    <div class="app-container">
        <header class="app-header">
            <button class="theme-btn" id="theme-btn" aria-label="Theme" onclick="toggleTheme(event)"><span class="theme-icon" id="theme-icon"></span></button>
            <div class="header-logo-container"><img src="assets/tree.png" alt="Tree Logo" class="main-logo"></div>
            
            <div style="display: flex; gap: 8px; align-items: center;">
                <button class="theme-btn" onclick="logoutAdmin()" aria-label="Logout" style="color: var(--danger);">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </button>
                
                <div class="lang-switcher" id="lang-switcher">
                    <button class="lang-btn-main" id="current-lang-btn" type="button" onclick="toggleLangMenu(event)">
                        <img src="assets/free-icon-armenia-197516.png" class="lang-flag">
                    </button>
                    <div class="lang-dropdown-content">
                        <button type="button" class="lang-tab active" data-lang="AM" onclick="setAdminLang('AM', event)"><img src="assets/free-icon-armenia-197516.png" class="lang-flag"></button>
                        <button type="button" class="lang-tab" data-lang="RU" onclick="setAdminLang('RU', event)"><img src="assets/free-icon-russia-9994030.png" class="lang-flag"></button>
                        <button type="button" class="lang-tab" data-lang="EN" onclick="setAdminLang('EN', event)"><img src="assets/united-kingdom.png" class="lang-flag"></button>
                    </div>
                </div>
            </div>
        </header>

        <section class="admin-screen active" id="screen-dashboard">
            <h2 class="screen-title" data-i18n="tab_dashboard"></h2>
            <div class="dash-switcher">
                <button class="dash-tab dash-view-btn active" data-dash-view="overview" onclick="switchDashboardView('overview')">
                    <div class="notif-dot" id="dash-dot-overview" style="display:none;"></div>
                    <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
                </button>
                <button class="dash-tab dash-view-btn" data-dash-view="orders" onclick="switchDashboardView('orders')">
                    <div class="notif-dot" id="dash-dot-orders" style="display:none;"></div>
                    <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
                </button>
                <button class="dash-tab dash-view-btn" data-dash-view="masters" onclick="switchDashboardView('masters')">
                    <div class="notif-dot" id="dash-dot-masters" style="display:none;"></div>
                    <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                </button>
                <button class="dash-tab dash-view-btn" data-dash-view="partners" onclick="switchDashboardView('partners')">
                    <div class="notif-dot" id="dash-dot-partners" style="display:none;"></div>
                    <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path><line x1="12" y1="11" x2="12" y2="13"></line></svg>
                </button>
            </div>

            <div id="dash-overview" class="dash-view-content">
                <div id="dash-avg-rating-hero" class="rating-hero">★ 0.0</div>
                <div class="glass-panel">
                    <h3 class="input-label" data-i18n="lbl_recent_reviews"></h3>
                    <div class="entity-list" id="dash-reviews-list"></div>
                </div>
            </div>
            <div id="dash-orders" class="dash-view-content" style="display:none;">
                <div class="glass-panel">
                    <h3 class="input-label" data-i18n="lbl_new_requests"></h3>
                    <div class="entity-list" id="dash-orders-list"></div>
                </div>
            </div>
            <div id="dash-masters" class="dash-view-content" style="display:none;">
                <div class="glass-panel">
                    <h3 class="input-label" data-i18n="sw_inc_masters"></h3>
                    <div class="entity-list" id="dash-masters-list"></div>
                </div>
            </div>
            <div id="dash-partners" class="dash-view-content" style="display:none;">
                <div class="glass-panel">
                    <h3 class="input-label" data-i18n="lbl_new_partners"></h3>
                    <div class="entity-list" id="dash-partners-requests-list"></div>
                </div>
            </div>
        </section>

        <section class="admin-screen" id="screen-orders">
            <h2 class="screen-title" data-i18n="tab_orders"></h2>
            <div class="glass-panel">
                <div class="entity-list" id="orders-list"></div>
            </div>
        </section>

        <section class="admin-screen" id="screen-finance">
            <h2 class="screen-title" data-i18n="tab_finance"></h2>
            <div class="glass-panel">
                <p style="text-align:center;color:var(--text-sec);font-size:12px;" data-i18n="in_development"></p>
            </div>
        </section>

        <section class="admin-screen" id="screen-employees">
            <h2 class="screen-title" data-i18n="tab_employees"></h2>
            <div class="search-container">
                <input type="text" id="employee-search" class="glass-input search-input" data-i18n-placeholder="search_employee">
            </div>
            <div class="filter-tabs">
                <button class="filter-tab active" data-emp-filter="all" onclick="setEmpFilter('all')" data-i18n="filter_all"></button>
                <button class="filter-tab" data-emp-filter="doors" onclick="setEmpFilter('doors')" data-i18n="filter_doors"></button>
                <button class="filter-tab" data-emp-filter="electro" onclick="setEmpFilter('electro')" data-i18n="filter_electro"></button>
                <button class="filter-tab" data-emp-filter="universal" onclick="setEmpFilter('universal')" data-i18n="filter_universal"></button>
            </div>
            <div id="bday-banner-container"></div>
            <div class="glass-panel">
                <div class="entity-list" id="employees-list"></div>
            </div>
        </section>

        <section class="admin-screen" id="screen-partners">
            <h2 class="screen-title" data-i18n="tab_partners"></h2>
            <div class="glass-panel">
                <div class="entity-list" id="admin-partners-list"></div>
            </div>
        </section>

        <section class="admin-screen" id="screen-clients">
            <h2 class="screen-title" data-i18n="tab_clients"></h2>
            <div class="search-container">
                <input type="text" id="client-search" class="glass-input search-input" data-i18n-placeholder="search_client">
            </div>
            <div class="stats-grid" style="margin-bottom:10px;">
                <div class="stat-box"><div class="stat-value" id="clients-total-count">0</div><div class="stat-label" data-i18n="total_clients"></div></div>
            </div>
            <div class="glass-panel">
                <div class="entity-list" id="clients-list"></div>
            </div>
        </section>

        <section class="admin-screen" id="screen-management">
            <h2 class="screen-title" data-i18n="tab_management"></h2>
            <div class="view-switcher">
                <button class="view-switch-btn active" onclick="switchManagementTab('services', this)" data-i18n="tab_mng_services"></button>
                <button class="view-switch-btn" onclick="switchManagementTab('translations', this)" data-i18n="tab_mng_translations"></button>
                <button class="view-switch-btn" onclick="switchManagementTab('promo', this)" data-i18n="tab_mng_promo"></button>
            </div>
            <div id="mng-view-services" style="display:block; position: relative;">
                <div class="glass-panel">
                    <div class="entity-list" id="admin-services-list"></div>
                </div>
            </div>
            <div id="mng-view-translations" style="display:none;">
                <div class="glass-panel">
                    <div class="entity-list" id="translations-list"></div>
                    <button id="trans-save-btn" class="submit-btn success" onclick="saveTranslations()"><span data-i18n="save_translations"></span></button>
                </div>
            </div>
            <div id="mng-view-promo" style="display:none;">
                <div class="glass-panel">
                    <input type="text" id="promo-text-am" class="glass-input" placeholder="Promo AM">
                    <input type="text" id="promo-text-ru" class="glass-input" placeholder="Promo RU">
                    <input type="text" id="promo-text-en" class="glass-input" placeholder="Promo EN">
                    <input type="number" id="promo-discount-input" class="glass-input" data-i18n-placeholder="discount_percent">
                    <button id="promo-submit-btn" class="submit-btn success" onclick="savePromo(event)"><span data-i18n="save_promo"></span></button>
                </div>
            </div>
        </section>

        <button id="fab-orders" class="fab-btn" onclick="openOrderForm()" style="display: none;">
            <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
        </button>
        <button id="fab-employees" class="fab-btn" onclick="openEmployeeForm()" style="display: none;">
            <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
        </button>
        <button id="fab-partners" class="fab-btn" onclick="openPartnerForm()" style="display: none;">
            <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path><line x1="12" y1="11" x2="12" y2="17"></line><line x1="9" y1="14" x2="15" y2="14"></line></svg>
        </button>
        <button id="fab-services" class="fab-btn" onclick="openServiceForm()" style="display: none;">
            <svg viewBox="0 0 24 24" width="30" height="30" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>


        <div id="bio-prompt-modal" class="modal-overlay">
            <div class="modal-content glass-panel" style="text-align: center; padding: 30px;">
                <div class="bio-icon-circle" style="margin-bottom: 20px;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M12 2a10 10 0 0 0-10 10v2a10 10 0 0 0 10 10 10 10 0 0 0 10-10v-2a10 10 0 0 0-10-10z"></path>
                        <path d="M8 12a4 4 0 0 1 8 0"></path>
                        <path d="M10 16a2 2 0 0 1 4 0"></path>
                        <path d="M6 12v2"></path>
                        <path d="M18 12v2"></path>
                    </svg>
                </div>
                <h3 class="screen-title" style="margin-bottom: 10px;">Touch ID / Face ID</h3>
                <p style="font-size: 12px; color: var(--text-sec); margin-bottom: 25px; line-height: 1.5;">
                    Включите биометрический вход для быстрого и безопасного доступа без постоянного ввода пароля.
                </p>
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <button class="submit-btn success" onclick="registerBiometric()" style="margin: 0;">Включить</button>
                    <button class="modal-btn" onclick="document.getElementById('bio-prompt-modal').classList.remove('active');" style="background: transparent; color: var(--text-sec); padding: 12px;">Не сейчас</button>
                </div>
            </div>
        </div>

        <div id="order-modal" class="modal-overlay">
            <div class="modal-content glass-panel">
                <button class="modal-close-x" onclick="closeOrderModal()">✖</button>
                <h3 class="screen-title" id="modal-order-id" style="font-size: 14px; color: var(--tree-light);"></h3>
                <div class="detail-block">
                    <div class="detail-row"><span class="detail-label" data-i18n="client"></span><span class="detail-value" id="modal-order-client"></span></div>
                    <div class="detail-row"><span class="detail-label" data-i18n="phone"></span><span class="detail-value" id="modal-order-phone"></span><a id="modal-order-phone-link" class="call-btn" href="#">📞</a></div>
                    <div class="detail-row">
                        <span class="detail-label" data-i18n="address"></span>
                        <span class="detail-value" id="modal-order-address"></span>
                        <a id="modal-order-address-link" class="call-btn" target="_blank" style="display:none; text-decoration:none; background:rgba(59,130,246,0.15); color:#3B82F6; margin-left: 8px;">📍</a>
                    </div>
                    <div class="detail-row"><span class="detail-label" data-i18n="service"></span><span class="detail-value" id="modal-order-service"></span></div>
                </div>
                <div class="modal-actions-grid">
                    <button class="modal-btn success" onclick="closeOrderModal()" style="grid-column: span 2;">OK</button>
                </div>
            </div>
        </div>

        <div id="review-modal" class="modal-overlay">
            <div class="modal-content glass-panel">
                <button class="modal-close-x" onclick="closeReviewModal()">✖</button>
                <h3 class="screen-title" id="modal-rev-client"></h3>
                <div id="modal-rev-stars" style="color:var(--warning); text-align:center; font-size:20px; font-weight:900;"></div>
                <p id="modal-rev-text" style="font-size:13px; text-align:center; margin:10px 0; color:var(--text);"></p>
                <p id="modal-rev-date" style="font-size:10px; text-align:center; color:var(--text-sec);"></p>
            </div>
        </div>

        <div id="coop-modal" class="modal-overlay">
            <div class="modal-content glass-panel">
                <button class="modal-close-x" onclick="closeCoopModal()">✖</button>
                <h3 class="screen-title" id="modal-coop-company"></h3>
                <div class="detail-block">
                    <div class="detail-row"><span class="detail-label" data-i18n="contact"></span><span class="detail-value" id="modal-coop-contact"></span></div>
                    <div class="detail-row"><span class="detail-label" data-i18n="phone"></span><span class="detail-value" id="modal-coop-phone"></span><a id="modal-coop-phone-link" class="call-btn" href="#">📞</a></div>
                    <div class="detail-row"><span class="detail-label" data-i18n="date"></span><span class="detail-value" id="modal-coop-date"></span></div>
                    <div class="detail-row" style="flex-direction: column; align-items: flex-start; gap: 8px;">
                        <span class="detail-label" data-i18n="message"></span>
                        <span class="detail-value" id="modal-coop-text" style="text-align: left; width: 100%; font-size: 11px; font-weight: 600; color: var(--text-sec); line-height: 1.4;"></span>
                    </div>
                </div>
                <div class="modal-actions-grid">
                    <button class="modal-btn success" onclick="acceptCoop()" data-i18n="accept"></button>
                    <button class="modal-btn danger" onclick="rejectCoop()" data-i18n="reject"></button>
                </div>
            </div>
        </div>

        <div id="employee-modal" class="modal-overlay">
            <div class="modal-content glass-panel modal-scroll">
                <button class="modal-close-x" onclick="closeEmployeeModal()">✖</button>
                <div style="display:flex; justify-content:center; margin-bottom:10px;">
                    <div id="modal-emp-photo" style="width:80px; height:80px; border-radius:50%; background-size:cover; display:none; border:2px solid var(--tree-light);"></div>
                </div>
                <h3 class="screen-title" id="modal-emp-name"></h3>
                <div style="text-align:center;"><span id="modal-emp-type" class="entity-status"></span></div>
                
                <div class="detail-block">
                    <div class="detail-row"><span class="detail-label">ID</span><span class="detail-value" id="modal-emp-id"></span></div>
                    <div class="detail-row" id="emp-pin-row"><span class="detail-label" data-i18n="emp_pin"></span><span class="detail-value" id="modal-emp-access-key"></span></div>
                    <div class="detail-row"><span class="detail-label" data-i18n="phone"></span><span class="detail-value" id="modal-emp-phone-text"></span><a id="modal-emp-phone-link" class="call-btn" href="#">📞</a></div>
                    <div class="detail-row"><span class="detail-label" data-i18n="emp_address"></span><span class="detail-value" id="modal-emp-address"></span></div>
                    <div class="detail-row"><span class="detail-label" data-i18n="emp_exp"></span><span class="detail-value" id="modal-emp-exp"></span></div>
                    <div class="detail-row"><span class="detail-label" data-i18n="rating"></span><span class="detail-value" id="modal-emp-rating" style="color:var(--warning);"></span></div>
                    <div class="detail-row" id="modal-emp-bday-row"><span class="detail-label" data-i18n="birthday"></span><span class="detail-value"><span id="modal-emp-birth"></span> <span id="modal-emp-bday-countdown"></span></span></div>
                    <div class="detail-row"><span class="detail-label" data-i18n="company_debt"></span><span class="detail-value" id="modal-emp-debt"></span></div>
                </div>

                <div id="emp-schedule-block" class="detail-block">
                    <span class="detail-label" data-i18n="schedule"></span>
                    <div id="modal-emp-schedule-list" style="margin-top:5px;"></div>
                </div>
                
                <div id="emp-finance-block" class="detail-block">
                    <input type="number" id="emp-finance-input" class="glass-input" data-i18n-placeholder="amount" style="margin-bottom:8px;">
                    <div class="modal-actions-grid" style="margin-top:0;">
                        <button class="modal-btn danger" onclick="adjustEmpDebt('add')" data-i18n="debt"></button>
                        <button class="modal-btn success" onclick="adjustEmpDebt('bonus')" data-i18n="bonus"></button>
                    </div>
                </div>

                <div id="emp-orders-block" class="detail-block" style="cursor:pointer;" onclick="toggleEmpOrders()">
                    <div class="detail-row" style="border:none;">
                        <span class="detail-label"><span data-i18n="orders"></span> (<span id="modal-emp-orders-count"></span>)</span>
                        <span style="font-size:12px;">▼</span>
                    </div>
                    <div id="modal-emp-orders-list" style="display:none; flex-direction:column; gap:5px; margin-top:10px;"></div>
                </div>

                <div class="modal-actions-grid">
                    <button id="modal-emp-accept-btn" class="modal-btn success" onclick="acceptEmployee()" data-i18n="accept"></button>
                    <button id="modal-emp-reject-btn" class="modal-btn danger" onclick="rejectEmployee()" data-i18n="reject"></button>
                    <button id="modal-emp-edit-btn" class="modal-btn primary" onclick="openEmployeeForm(window.currentActiveEmpId)" data-i18n="edit"></button>
                    <button id="modal-emp-fire-btn" class="modal-btn danger" onclick="fireEmployee()" data-i18n="fire"></button>
                </div>
            </div>
        </div>

        <div id="employee-form-modal" class="modal-overlay">
            <div class="modal-content glass-panel modal-scroll">
                <button class="modal-close-x" onclick="closeEmployeeFormModal()">✖</button>
                <h3 class="screen-title" data-i18n="employee"></h3>
                <form id="employee-form" onsubmit="saveEmployeeForm(event)">
                    <input type="hidden" id="form-emp-photo-base64">
                    <div style="display:flex; justify-content:center; margin-bottom:10px;">
                        <label for="form-emp-photo" style="cursor:pointer; width:80px; height:80px; border-radius:50%; background:var(--card-border); display:flex; flex-direction:column; justify-content:center; align-items:center; position:relative; overflow:hidden;">
                            <div id="form-emp-photo-preview" style="position:absolute; width:100%; height:100%; background-size:cover; background-position:center;"></div>
                            <span id="photo-placeholder-icon" style="font-size:24px;">📷</span>
                        </label>
                        <input type="file" id="form-emp-photo" accept="image/*" style="display:none;" onchange="previewEmpPhoto(event)">
                    </div>
                    <div class="input-group">
                        <input type="text" id="form-emp-name" class="glass-input" data-i18n-placeholder="emp_name" required>
                        <input type="tel" id="form-emp-phone" class="glass-input" data-i18n-placeholder="emp_phone" required>
                        <input type="text" id="form-emp-address" class="glass-input" data-i18n-placeholder="emp_address">
                        <input type="date" id="form-emp-birth" class="glass-input" data-i18n-placeholder="emp_birth">
                        <input type="text" id="form-emp-exp" class="glass-input" data-i18n-placeholder="emp_exp">
                        <input type="text" id="form-emp-access-key" class="glass-input" data-i18n-placeholder="emp_pin" required>
                    </div>
                    <div class="input-group" style="margin-top:10px;">
                        <span class="input-label" data-i18n="specialties"></span>
                        <div id="form-emp-professions-container" style="display:flex; flex-wrap:wrap; gap:8px;"></div>
                        <button type="button" class="modal-btn primary" style="padding:8px; margin-top:5px;" onclick="addNewProfession()" data-i18n="add_specialty"></button>
                    </div>
                    <button type="submit" class="submit-btn success" style="margin-top:15px;" data-i18n="save"></button>
                </form>
            </div>
        </div>

        <div id="service-form-modal" class="modal-overlay">
            <div class="modal-content glass-panel">
                <button class="modal-close-x" onclick="closeServiceForm()">✖</button>
                <h3 class="screen-title" data-i18n="service"></h3>
                <form onsubmit="saveServiceForm(event)" style="display:flex; flex-direction:column; gap:10px;">
                    <input type="text" id="form-cat-name" class="glass-input" data-i18n-placeholder="name" required>
                    <input type="number" id="form-cat-price" class="glass-input" data-i18n-placeholder="price" required>
                    <input type="text" id="form-cat-icon" class="glass-input" data-i18n-placeholder="svg_icon">
                    <select id="form-cat-status" class="glass-input">
                        <option value="active" data-i18n="active"></option>
                        <option value="disabled" data-i18n="disabled"></option>
                    </select>
                    <button type="submit" class="submit-btn success" data-i18n="save"></button>
                </form>
            </div>
        </div>

        <div id="partner-form-modal" class="modal-overlay">
            <div class="modal-content glass-panel">
                <button class="modal-close-x" onclick="closePartnerForm()">✖</button>
                <h3 class="screen-title" data-i18n="partner"></h3>
                <form onsubmit="savePartnerForm(event)" style="display:flex; flex-direction:column; gap:10px;">
                    <input type="text" id="form-partner-name" class="glass-input" data-i18n-placeholder="company_name" required>
                    <input type="text" id="form-partner-logo" class="glass-input" data-i18n-placeholder="svg_logo">
                    <button type="submit" class="submit-btn success" data-i18n="save"></button>
                </form>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="tab-item active" onclick="switchTab('screen-dashboard', this)"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg><span data-i18n="tab_dashboard"></span></button>
        <button class="tab-item" onclick="switchTab('screen-orders', this)"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg><span data-i18n="tab_orders"></span></button>
        <button class="tab-item" onclick="switchTab('screen-finance', this)"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg><span data-i18n="tab_finance"></span></button>
        <button class="tab-item" onclick="switchTab('screen-employees', this)"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span data-i18n="tab_employees"></span></button>
        <button class="tab-item" onclick="switchTab('screen-partners', this)"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"></path></svg><span data-i18n="tab_partners"></span></button>
        <button class="tab-item" onclick="switchTab('screen-clients', this)"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg><span data-i18n="tab_clients"></span></button>
        <button class="tab-item" onclick="switchTab('screen-management', this)"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg><span data-i18n="tab_management"></span></button>
    </nav>
    <script src="js/admin.js"></script>
</body>
